<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cyan Blue Accent Gradient -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Squircle (Sudut Membulat Beranda HP) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Border Halus -->
  <rect width="502" height="502" x="5" y="5" rx="107" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.3"/>

  <!-- Cahaya Background (Subtle Glow) -->
  <circle cx="256" cy="256" r="160" fill="#2563eb" opacity="0.12"/>

  <!-- GRAPH BARS (Grafik Keuangan / Badan Toko) -->
  <!-- Bar 1 (Kiri) -->
  <rect x="136" y="290" width="48" height="100" rx="12" fill="url(#blue)" opacity="0.6"/>
  <!-- Bar 2 (Tengah Kiri) -->
  <rect x="204" y="250" width="48" height="140" rx="12" fill="url(#blue)" opacity="0.85"/>
  <!-- Bar 3 (Tengah Kanan) -->
  <rect x="272" y="210" width="48" height="180" rx="12" fill="url(#blue)"/>
  <!-- Bar 4 (Kanan / Puncak Omset) -->
  <rect x="340" y="150" width="48" height="240" rx="12" fill="url(#gold)"/>

  <!-- ATAP WARUNG ELEGAN (Golden Canopy / Awning) -->
  <path d="M 96 170 C 96 155 108 145 125 145 L 387 145 C 404 145 416 155 416 170 C 416 182 406 195 390 195 C 374 195 364 182 352 182 C 340 182 330 195 314 195 C 298 195 288 182 276 182 C 264 182 254 195 238 195 C 222 195 212 182 200 182 C 188 182 178 195 162 195 C 146 195 136 182 124 182 C 112 182 96 182 96 170 Z" fill="url(#gold)"/>

  <!-- GARIS TREN PERTUMBUHAN (Gold Trendline Arrow) -->
  <path d="M 120 320 Q 220 280 290 200 T 400 115" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <!-- Ujung Panah -->
  <path d="M 365 112 L 405 112 L 405 152" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AKSEN BINTANG SUKSES (Sparkle) -->
  <path d="M 405 100 L 410 80 L 430 75 L 410 70 L 405 50 L 400 70 L 380 75 L 400 80 Z" fill="#fef08a"/>
</svg>